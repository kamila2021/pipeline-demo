# =================================================================
# GitLab CI/CD Pipeline Config - Fullstack React 19 + Express 5
# =================================================================

image: node:20-alpine

# Etapas del pipeline (en español según requerimientos del proyecto)
stages:
  - construir
  - probar
  - desplegar

# Variables de entorno globales
variables:
  NODE_ENV: "production"
  VITE_API_URL: "http://localhost:5001/api"
  PORT: "5001"
  DB_HOST: "localhost"
  DB_PORT: "5432"
  DB_NAME: "taskdb"
  DB_USER: "postgres"
  DB_PASSWORD: "postgres"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# Estrategia de caché para optimizar tiempos de ejecución
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .npm/
    - backend/node_modules/
    - frontend/node_modules/

# =================================================================
# STAGE: construir
# =================================================================

construir_backend:
  stage: construir
  script:
    - echo "📦 Instalando dependencias del Backend Express 5..."
    - cd backend
    - npm ci --prefer-offline
  artifacts:
    paths:
      - backend/node_modules/
    expire_in: 1 day

construir_frontend:
  stage: construir
  script:
    - echo "🏗️ Instalando dependencias y compilando Frontend React 19 + Vite..."
    - cd frontend
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
      - frontend/node_modules/
    expire_in: 1 week

# =================================================================
# STAGE: probar
# =================================================================

probar_backend:
  stage: probar
  needs:
    - construir_backend
  variables:
    NODE_ENV: "test"
  script:
    - echo "🧪 Ejecutando suite de pruebas automatizadas del Backend (Vitest + Supertest)..."
    - cd backend
    - npm run test

probar_frontend:
  stage: probar
  needs:
    - construir_frontend
  script:
    - echo "🧪 Ejecutando suite de pruebas unitarias del Frontend (Vitest + React Testing Library)..."
    - cd frontend
    - npm run test

# =================================================================
# STAGE: desplegar
# =================================================================

desplegar_staging:
  stage: desplegar
  needs:
    - probar_backend
    - probar_frontend
    - construir_frontend
  script:
    - echo "🚀 Desplegando versión de prueba en entorno de Staging..."
    - echo "Servicios objetivo: Systemd (backend-taskdb) y Nginx Reverse Proxy"
    - echo "Verificando artefactos de producción en frontend/dist/..."
    - test -d frontend/dist && echo "🟢 Artefactos estáticos listos."
    - echo "✅ Despliegue en Staging completado exitosamente."
  environment:
    name: staging
    url: http://staging.taskdb.local
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

desplegar_produccion:
  stage: desplegar
  needs:
    - probar_backend
    - probar_frontend
    - construir_frontend
  script:
    - echo "🚀 Desplegando aplicación en el entorno de Producción..."
    - echo "Actualizando backend mediante Systemd backend-taskdb..."
    - echo "Sirviendo bundle frontend/dist mediante Nginx..."
    - echo "✅ Despliegue en Producción finalizado con éxito."
  environment:
    name: production
    url: http://taskdb.local
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
