# =========================================================
# Configuración Nginx para Docker Compose local (con HTTPS).
# Variante de deploy/nginx/taskdb.conf (producción bare-metal):
# usa DNS interno de Compose para el backend y sirve el frontend
# ya compilado dentro de la propia imagen. Si cambias headers o
# rutas aquí, replica el cambio en ese archivo también.
# =========================================================

upstream backend_express {
    server backend:5001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/taskdb.crt;
    ssl_certificate_key /etc/nginx/tls/taskdb.key;

    # Directorio de distribución del Frontend React 19 (Vite), copiado por el Dockerfile
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. Enrutamiento directo al Health Check local del backend (/health)
    location /health {
        proxy_pass http://backend_express/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # 2. Proxy para la API REST (/api/)
    location /api/ {
        proxy_pass http://backend_express/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de lectura y escritura
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 3. Enrutamiento SPA de React para la raíz y rutas estáticas (Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desactivar logs para favicon y robots
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    # Control de errores 50x
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
